name: Release Desktop Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-desktop-binaries:
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            artifact_name: 'Gordon-Setup.exe'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            artifact_name: 'Gordon-arm64.dmg'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            artifact_name: 'gordon_amd64.deb'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node Dependencies
        run: npm install

      - name: Run Diagnostics and Automated Tests
        shell: bash
        run: |
          npm run lint
          npx tsx --test packages/*/tests/*.test.ts tests/integration/*.test.ts

      - name: Build Web Frontend
        run: npm run build --workspace=apps/desktop-ui

      - name: Build Tauri Desktop Native Binary
        uses: nick-invision/retry@v3
        with:
          timeout_minutes: 30
          max_attempts: 3
          retry_wait_seconds: 15
          command: npx tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Enforce Size Budget (< 100MB)
        shell: bash
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const targetDir = path.resolve('src-tauri/target/${{ matrix.target }}/release/bundle');
            if (fs.existsSync(targetDir)) {
              const files = fs.readdirSync(targetDir, { recursive: true });
              for (const f of files) {
                const full = path.join(targetDir, f);
                if (fs.statSync(full).isFile()) {
                  const sizeMb = fs.statSync(full).size / (1024 * 1024);
                  console.log(\`Artifact \${f}: \${sizeMb.toFixed(2)} MB\`);
                  if (sizeMb > 100) {
                    console.error(\`ERROR: Binary exceeds 100MB budget: \${f} (\${sizeMb.toFixed(2)} MB)\`);
                    process.exit(1);
                  }
                }
              }
            }
          "

      - name: Save Bundle Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: binaries-${{ matrix.target }}
          path: src-tauri/target/${{ matrix.target }}/release/bundle/
          if-no-files-found: ignore

  publish-github-release:
    needs: build-desktop-binaries
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/')
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Download All Platform Binaries
        uses: actions/download-artifact@v4
        with:
          path: release-assets/

      - name: List Downloaded Assets
        run: find release-assets/ -type f | head -50

      - name: Delete Stale Release (if exists)
        run: gh release delete "${{ github.ref_name }}" --yes || true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Create Release and Upload Assets
        run: |
          sleep 3
          FILES=$(find release-assets/ -type f | tr '\n' ' ')
          echo "Uploading files: $FILES"
          gh release create "${{ github.ref_name }}" \
            --title "Gordon ${{ github.ref_name }}" \
            --generate-notes \
            $FILES
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
