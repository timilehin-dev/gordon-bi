name: Release Desktop Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'windows-latest'
            target: 'x86_64-pc-windows-msvc'
            artifact_name: 'Gordon-Setup.exe'
          - platform: 'macos-latest'
            target: 'aarch64-apple-darwin'
            artifact_name: 'Gordon-arm64.dmg'
          - platform: 'ubuntu-22.04'
            target: 'x86_64-unknown-linux-gnu'
            artifact_name: 'gordon_amd64.deb'

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Upgrade npm to latest
        run: npm install -g npm@latest

      - name: Setup Rust Toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install Linux System Dependencies
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libssl-dev libgtk-3-dev libayatana-appindicator3-dev librsvg2-dev

      - name: Install Node Dependencies
        run: npm install

      - name: Run Diagnostics and Automated Tests
        run: |
          npm run lint
          npx tsx --test packages/**/tests/*.test.ts tests/integration/*.test.ts

      - name: Build Web Frontend
        run: npm run build --workspace=apps/desktop-ui

      - name: Build Tauri Desktop Native Binary
        run: npx tauri build --target ${{ matrix.target }}
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}

      - name: Enforce Size Budget (< 100MB)
        run: |
          node -e "
            const fs = require('fs');
            const path = require('path');
            const targetDir = path.resolve('src-tauri/target/${{ matrix.target }}/release/bundle');
            if (fs.existsSync(targetDir)) {
              const files = fs.readdirSync(targetDir, { recursive: true });
              for (const f of files) {
                const full = path.join(targetDir, f);
                if (fs.statSync(full).isFile()) {
                  const sizeMb = fs.statSync(full).size / (1024 * 1024);
                  console.log(\`Artifact \${f}: \${sizeMb.toFixed(2)} MB\`);
                  if (sizeMb > 100) {
                    console.error(\`ERROR: Binary exceeds 100MB budget: \${f} (\${sizeMb.toFixed(2)} MB)\`);
                    process.exit(1);
                  }
                }
              }
            }
          "

      - name: Upload Release Artifacts
        uses: softprops/action-gh-release@v2
        if: startsWith(github.ref, 'refs/tags/')
        with:
          files: |
            src-tauri/target/${{ matrix.target }}/release/bundle/**/*
          generate_release_notes: true
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
